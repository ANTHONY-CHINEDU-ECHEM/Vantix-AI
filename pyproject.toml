[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "vantix"
version = "1.0.0"
description = "Vantix AI: hybrid recommender and retrieval augmented generation engine for project management platforms"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary. Copyright Phexara Ltd." }
authors = [{ name = "Phexara Ltd" }]
keywords = ["recommender", "rag", "retrieval", "project-management", "search"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Private :: Do Not Upload",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "httpx>=0.27",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
models = ["sentence-transformers>=2.7"]
tokenizer = ["tiktoken>=0.6"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4", "mypy>=1.10"]
all = ["vantix[postgres,models,tokenizer]"]

[project.scripts]
vantix = "vantix.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vantix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# FastAPI dependency injection relies on calls in argument defaults.
ignore = ["B008", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"examples/generate_sample_data.py" = ["E501"]
"src/vantix/rag/prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
