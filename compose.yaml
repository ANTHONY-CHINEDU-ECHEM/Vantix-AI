# Production shaped local stack: Vantix API, training worker and migrations with
# PostgreSQL, Qdrant and OpenSearch. Start with: docker compose up
name: vantix

x-vantix: &vantix
  build: .
  env_file:
    - path: .env
      required: false
  environment: &vantix_env
    VANTIX_DATABASE_URL: postgresql+psycopg://vantix:vantix@postgres:5432/vantix
    VANTIX_VECTOR_BACKEND: qdrant
    VANTIX_QDRANT_URL: http://qdrant:6333
    VANTIX_LEXICAL_BACKEND: opensearch
    VANTIX_OPENSEARCH_URL: http://opensearch:9200
    VANTIX_MODEL_DIR: /data/models
  volumes:
    - vantix_data:/data
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  migrate:
    <<: *vantix
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  vantix:
    <<: *vantix
    command: ["serve"]
    environment:
      <<: *vantix_env
      VANTIX_REC_TRAINING_INTERVAL_SECONDS: "0"
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
      opensearch:
        condition: service_healthy
    restart: unless-stopped

  worker:
    <<: *vantix
    command: ["worker"]
    environment:
      <<: *vantix_env
      VANTIX_REC_TRAINING_INTERVAL_SECONDS: "300"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "vantix", "health"]
      interval: 60s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vantix
      POSTGRES_PASSWORD: vantix
      POSTGRES_DB: vantix
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "vantix"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.20.0
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"

  opensearch:
    image: opensearchproject/opensearch:2.19.7
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  vantix_data:
  postgres_data:
  qdrant_data:
  opensearch_data:
