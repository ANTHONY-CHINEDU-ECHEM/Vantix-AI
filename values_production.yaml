config:
  VANTIX_ENVIRONMENT: production
  VANTIX_RERANKER_PROVIDER: http
  VANTIX_LLM_PROVIDER: anthropic
  VANTIX_EMBEDDING_PROVIDER: openai_compatible
api:
  replicaCount: 3
  workers: 2
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
worker:
  trainingIntervalSeconds: 900
persistence:
  size: 50Gi
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 25m
  hosts:
    - host: vantix.example.internal
      paths: [{path: /, pathType: Prefix}]
  tls:
    - secretName: vantix-tls
      hosts: [vantix.example.internal]
metrics:
  serviceMonitor:
    enabled: true
